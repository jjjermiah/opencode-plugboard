<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 524" width="360" height="524" role="img" aria-labelledby="t d">
  <title id="t">How plugboard fits in</title>
  <desc id="d">Apps call plugboard with the OpenAI, Anthropic or Gemini API. Plugboard runs inside your OpenCode server and turns each request into an OpenCode session, which uses your provider logins: Claude, ChatGPT, GitHub Copilot and OpenCode Go.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #18181b; font-size: 14px }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .muted { fill: #71717a }
    .h { font-size: 15px; font-weight: 600 }
    .label { font-size: 11px; letter-spacing: .08em; fill: #71717a; font-weight: 600 }
    .win { fill: #fafafa; stroke: #e4e4e7 }
    .bar { fill: #f4f4f5 }
    .rule { stroke: #e4e4e7 }
    .card { fill: #fff; stroke: #e4e4e7 }
    .hot { fill: #eef0ff; stroke: #5b5fe6; stroke-width: 1.5 }
    .accent { fill: #4a4ed0 }
    .pill { fill: #fff; stroke: #e4e4e7 }
    .wire { fill: none; stroke: #a1a1aa; stroke-width: 1.5 }
    .head { fill: #a1a1aa }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" class="head"/></marker>
  </defs>

  <text x="0" y="12" class="label">YOUR APPS</text>
  <rect x="0" y="22" width="108" height="40" rx="10" class="pill"/><text x="54" y="47" text-anchor="middle">Open WebUI</text>
  <rect x="126" y="22" width="108" height="40" rx="10" class="pill"/><text x="180" y="47" text-anchor="middle">n8n</text>
  <rect x="252" y="22" width="108" height="40" rx="10" class="pill"/><text x="306" y="47" text-anchor="middle">Your script</text>
  <path d="M180 66V102" class="wire" marker-end="url(#a)"/>

  <rect x="0" y="104" width="360" height="278" rx="14" class="win"/>
  <path d="M0 118a14 14 0 0 1 14-14h332a14 14 0 0 1 14 14v22H0z" class="bar"/>
  <path d="M0 140H360" class="rule"/>
  <circle cx="20" cy="122" r="5" fill="#ff5f57"/><circle cx="36" cy="122" r="5" fill="#febc2e"/><circle cx="52" cy="122" r="5" fill="#28c840"/>
  <text x="180" y="126" text-anchor="middle" class="mono muted" style="font-size:12px">OpenCode server</text>

  <rect x="16" y="156" width="328" height="72" rx="12" class="hot"/>
  <text x="34" y="182" class="h accent">plugboard</text>
  <text x="326" y="182" text-anchor="end" class="mono muted" style="font-size:12px">127.0.0.1:4010</text>
  <text x="34" y="208" style="font-size:13px">OpenAI, Anthropic and Gemini compatible APIs</text>
  <path d="M180 230V252" class="wire" marker-end="url(#a)"/>
  <rect x="16" y="254" width="328" height="66" rx="12" class="card"/>
  <text x="34" y="280" class="h">OpenCode session</text>
  <text x="34" y="302" class="muted" style="font-size:12px">one per request, in the app's directory</text>
  <text x="180" y="346" text-anchor="middle" class="muted" style="font-size:12px">Tool calls go back to your app.</text>
  <text x="180" y="364" text-anchor="middle" class="muted" style="font-size:12px">OpenCode never runs them.</text>

  <path d="M180 386V418" class="wire" marker-end="url(#a)"/>
  <text x="0" y="436" class="label">YOUR LOGINS</text>
  <rect x="0" y="446" width="174" height="34" rx="10" class="pill"/><text x="87" y="468" text-anchor="middle">Claude</text>
  <rect x="186" y="446" width="174" height="34" rx="10" class="pill"/><text x="273" y="468" text-anchor="middle">ChatGPT</text>
  <rect x="0" y="490" width="174" height="34" rx="10" class="pill"/><text x="87" y="512" text-anchor="middle">GitHub Copilot</text>
  <rect x="186" y="490" width="174" height="34" rx="10" class="pill"/><text x="273" y="512" text-anchor="middle">OpenCode Go</text>
</svg>
