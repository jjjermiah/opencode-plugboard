# Copy to the LibreChat project root as librechat.yaml. The key comes from .env (see .env.example).
version: 1.3.17
cache: true
endpoints:
  custom:
    - name: 'Plugboard'
      apiKey: '${PLUGBOARD_KEY}'
      baseURL: 'http://host.docker.internal:4010/v1'
      models:
        default: ['fast']
        fetch: true
      titleConvo: true
      titleModel: 'fast'
      modelDisplayLabel: 'Plugboard'
    - name: 'Plugboard (Claude)'
      provider: 'anthropic'
      apiKey: '${PLUGBOARD_KEY}'
      baseURL: 'http://host.docker.internal:4010'
      headers:
        anthropic-version: '2023-06-01'
      models:
        default: ['fast']
        fetch: false
