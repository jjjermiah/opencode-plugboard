[package]
name = "async-openai-plugboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Exact pin: the version Cargo.lock resolves and docs/clients/async-openai.md records (0.42.2).
async-openai = { version = "=0.42.2", features = ["chat-completion"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
