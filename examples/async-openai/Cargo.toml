[package]
name = "async-openai-plugboard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-openai = { version = "0.42", default-features = true, features = ["chat-completion"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
