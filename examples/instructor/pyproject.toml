[project]
name = "plugboard-example-instructor"
version = "0.1.0"
description = "Instructor (validated extraction) against plugboard: the structured-output scenario in three modes. Exact pins, locked in uv.lock."
requires-python = ">=3.12"
# Exact pins: the direct dependencies. uv.lock pins everything else. instructor 1.17 caps jiter below 0.15, which
# conflicts with openai 3.x, so this example keeps openai 2.x (the same pins as the 2026-10-12 record).
dependencies = ["instructor==1.17.0", "openai==2.54.0", "pydantic>=2.0"]
