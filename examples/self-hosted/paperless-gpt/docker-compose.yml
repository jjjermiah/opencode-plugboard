# paperless-gpt, pointed at plugboard on the host. paperless-ngx must already run.
# Copy .env.example to .env and fill it in first.
services:
  paperless-gpt:
    image: icereed/paperless-gpt:latest
    restart: unless-stopped
    env_file:
      - .env
    # Loopback only. paperless-gpt has no authentication.
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
