# paperless-ai, pointed at plugboard on the host. paperless-ngx must already run.
# Copy .env.example to .env and fill it in first. Based on the upstream compose file at d2fda69.
services:
  paperless-ai:
    image: clusterzx/paperless-ai
    container_name: paperless-ai
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - RAG_SERVICE_URL=http://localhost:8000
      - RAG_SERVICE_ENABLED=true
    # Loopback only until setup is done. The setup route is open before that.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - paperless-ai_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  paperless-ai_data:
