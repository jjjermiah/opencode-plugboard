# Advisories in the packages a fresh resolve of examples/aider installs, after every fixable one was lifted (see pyproject.toml). There
# is no lockfile, so osv-scanner finds nothing to scan here by itself and these entries apply only if a scan is given a resolved set
# (for example `uv export` output). The example is a dev-only scripted check: it ships in no package, and Aider runs in a throwaway
# directory against the capture proxy. Each entry expires, so it is looked at again then.

# aider-chat 0.86.2 is the last Aider release and has no fixed version.
[[IgnoredVulns]]
id = "GHSA-7w7m-v5vp-w699"
ignoreUntil = 2027-01-17
reason = "aider-chat 0.86.2, no fixed release. Code injection through editor_coder.run, which the example does not use: it runs one --message and exits."

[[IgnoredVulns]]
id = "GHSA-hchg-qm84-cj9p"
ignoreUntil = 2027-01-17
reason = "aider-chat 0.86.2, no fixed release. SSRF through the AWS EC2 metadata endpoint, a Bedrock path the example does not use."

# diskcache 5.6.3 has no fixed version.
[[IgnoredVulns]]
id = "GHSA-w8v5-vhqr-4h9v"
ignoreUntil = 2027-01-17
reason = "diskcache 5.6.3, no fixed release. Unsafe pickle deserialization needs write access to the cache directory, which is a throwaway directory here."

# litellm stays at 1.81.10: Aider 0.86.2 pins it, and refuses to start with a litellm that adds an exception class it does not
# list (1.81.11 and every later release adds PermissionDeniedError). Every advisory below concerns the litellm proxy server: its admin API, SSO or
# OIDC login, MCP gateway, guardrails or prompt endpoints. Aider calls only the litellm SDK (litellm.completion) and never
# starts the proxy, so none of that code runs.
[[IgnoredVulns]]
id = "GHSA-3cv6-jpf6-8222"
ignoreUntil = 2027-01-17
reason = "litellm proxy only (authenticated SSRF); Aider uses the SDK, and no fixed version works with Aider 0.86.2."

