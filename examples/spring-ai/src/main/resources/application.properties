# The key and the URL come from the environment: PLUGBOARD_KEY and PLUGBOARD_BASE_URL (ends in /v1).
spring.ai.openai.api-key=${PLUGBOARD_KEY}
spring.ai.openai.base-url=${PLUGBOARD_BASE_URL}
spring.ai.openai.chat.options.model=fast

# The runner is a command line program: no web server, no banner, and Spring's own logging kept quiet.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
