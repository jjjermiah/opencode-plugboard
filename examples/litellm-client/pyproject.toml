[project]
name = "plugboard-example-litellm-client"
version = "0.1.0"
description = "LiteLLM as a client (openai/ prefix, Chat Completions) against plugboard: S1 to S3, S6 and the tool round trip. Exact pins, locked in uv.lock."
requires-python = ">=3.12"
# Exact pins: the direct dependencies. litellm needs openai below 3, so this stays on openai 2.x.
dependencies = ["litellm==1.105.0", "openai==2.54.0", "pydantic>=2.0"]
