[project]
name = "plugboard-compat-py-litellm"
version = "0.1.0"
description = "LiteLLM, DSPy and Instructor clients run against plugboard (compat/py/clients). Pinned to openai 2.x: litellm needs openai<3"
requires-python = ">=3.12"
dependencies = [
    "dspy==3.4.0",
    "instructor==1.17.0",
    "litellm==1.105.0",
    "pydantic>=2.0",
]
