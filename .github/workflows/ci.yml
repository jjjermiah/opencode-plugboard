name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by publish.yml so a release runs the same gates as CI.
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Typecheck, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Check the packed file list
        run: bun .github/scripts/check-pack.ts
      - name: Smoke-test the packed tarball
        run: bun .github/scripts/smoke-pack.ts

  # The published @opencode/plugin versions inside the peer range, so a new host release is
  # picked up without editing this file.
  host-versions:
    name: Host versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: pick
        run: echo "versions=$(bun .github/scripts/host-versions.ts)" >> "$GITHUB_OUTPUT"

  host:
    name: OpenCode host ${{ matrix.host }}
    needs: host-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.host-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install @opencode/plugin ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
        run: bun add --dev --exact "@opencode/plugin@$HOST"
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (when the package has a test script)
        run: |
          if [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = true ]; then
            bun run test
          else
            echo "No test script, skipping."
          fi

  compat:
    name: Compat kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Typecheck compat/js
        working-directory: compat/js
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
      - name: Compile compat Python
        run: git ls-files -z 'compat/py/*.py' 'compat/tools/*.py' | xargs -0 python3 -m py_compile
      - name: Syntax-check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
