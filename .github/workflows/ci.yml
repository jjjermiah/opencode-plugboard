name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by publish.yml so a release runs the same gates as CI.
  workflow_call:
  # host-bump.yml approves this on its own pull request: a PR opened with GITHUB_TOKEN holds its pull_request runs for approval.
  workflow_dispatch:

permissions: {}

# Pull request and branch runs: a newer run on the same ref cancels the older one. A push to main gets a group
# keyed by its commit SHA, so no later push can cancel or replace an earlier one. The release script tags a merge
# commit only after that commit's own run passed (.github/scripts/release.ts), and that run must stay its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    name: Typecheck, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # #114: Biome lint and format check (biome.jsonc). `bun run format:write` fixes a format failure.
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      # #110 and #100: per-layer test counts and coverage must stay at or above the floors in .github/floors/.
      - name: Test gates (test counts and coverage)
        run: |
          bun test --coverage --coverage-reporter=lcov --coverage-dir="$RUNNER_TEMP/gates" --reporter=junit --reporter-outfile="$RUNNER_TEMP/gates/junit.xml" > /dev/null
          bun .github/scripts/test-gates.ts "$RUNNER_TEMP/gates" --summary
      # #116: every route x request format x mode has a covering test, in the job summary; fails when the manifest and the router disagree.
      - name: Route coverage manifest
        run: bun .github/scripts/coverage-manifest.ts --summary
      # #101: the client x scenario x endpoint matrix, in the job summary; docs/compatibility.md must match it.
      - name: Client compatibility matrix
        env:
          PLUGBOARD_COMPAT_RESULTS: ${{ runner.temp }}/compat.json
        run: |
          bun test test/compat > /dev/null
          bun .github/scripts/compat-matrix.ts "$PLUGBOARD_COMPAT_RESULTS" --summary --docs docs/compatibility.md
          git diff --exit-code docs/compatibility.md || { echo "docs/compatibility.md is stale: regenerate it (see the file's header)"; exit 1; }
      # dist/tui.js (the compiled ./tui entry) is built here, not by prepack: `npm pack --ignore-scripts` skips prepack.
      - name: Build the compiled TUI entry
        run: bun run build:tui
      - name: Check the packed file list
        run: bun .github/scripts/check-pack.ts
      - name: Smoke-test the packed tarball
        run: bun .github/scripts/smoke-pack.ts
      # The `(since next)` placeholder is replaced at release time (docs/releasing.md): none may sit in a released CHANGELOG section.
      - name: No since-next placeholder in a released section
        run: bun .github/scripts/since-next.ts --check
      # #167: docs.yml builds the site only on push to main, so a broken link or VitePress error shows here on the pull request.
      - name: Build the docs site
        run: bun run docs:build

  # The published @opencode/plugin versions inside the peer range, so a new host release is
  # picked up without editing this file.
  host-versions:
    name: Host versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: pick
        run: echo "versions=$(bun .github/scripts/host-versions.ts)" >> "$GITHUB_OUTPUT"

  host:
    name: OpenCode host ${{ matrix.host }}
    needs: host-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.host-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The host ships its own effect pin (2.0.26: rc.112, 2.0.27: 4.0.1); the typecheck must use that copy.
      - name: Install @opencode/plugin ${{ matrix.host }} and its effect
        env:
          HOST: ${{ matrix.host }}
        run: |
          EFFECT=$(npm view "@opencode/plugin@$HOST" dependencies.effect)
          bun add --dev --exact "@opencode/plugin@$HOST" "effect@$EFFECT"
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (when the package has a test script)
        run: |
          if [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = true ]; then
            bun run test
          else
            echo "No test script, skipping."
          fi

  # The scripted runs of the client examples take about 5 seconds and are deterministic. A diff, or a new file in the run
  # directories, means a run went stale: regenerate it with `bun examples/_harness/run.ts <example> --target scripted`.
  examples:
    name: Examples (scripted runs are current)
    runs-on: ubuntu-latest
    # The Python examples (DSPy, LiteLLM, Instructor, OpenAI Agents, Aider) resolve and install their locked envs on first run.
    # A cold run takes under two minutes, so 15 minutes leaves room for a slow runner and fails a hang sooner.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install uv (the Python example runs with uv run --frozen)
        run: pipx install uv==0.12.18
      - name: Install Go (the go-openai runner builds with go run)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: examples/go-openai/go.sum
      - name: Install the .NET SDK (the openai-dotnet runner builds with dotnet run)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: examples/openai-dotnet/global.json
      - name: Print the .NET SDK the runner builds with (global.json applies in the example directory)
        working-directory: examples/openai-dotnet
        run: dotnet --version
      # The spring-ai and langchain4j runners build with their Maven wrapper (it downloads Maven 3.9.11) on Java 21.
      - name: Install Java (the spring-ai and langchain4j runners build with ./mvnw)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Snippet region names are unique per file
        run: bun examples/_harness/check-regions.ts
      # `all` runs every example that has a runner, so a new example needs no edit here (and parallel example PRs
      # stop conflicting on this list).
      - name: Scripted runs of every example
        run: bun examples/_harness/run.ts all --target scripted
      - name: Type check the TypeScript examples
        run: |
          (cd examples/openai-js && bunx tsc --noEmit)
          (cd examples/tool-bot && bunx tsc --noEmit)
          (cd examples/anthropic-js && bunx tsc --noEmit)
          (cd examples/langchain-anthropic-js && bunx tsc --noEmit)
          (cd examples/vercel-ai-sdk-anthropic && bunx tsc --noEmit)
      # The examples index (examples/README.md) and every <<< snippet import in docs/ must match the tree. The docs build
      # below reads the same records.
      - name: Examples index is current and every snippet import resolves
        run: bun .github/scripts/examples-index.ts --check
      - name: Shell scripts parse (examples and scripts)
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: The committed scripted runs match a fresh run
        run: |
          shopt -s nullglob
          RUNS=(examples/*/runs/scripted)
          if [ -n "$(git status --porcelain -- "${RUNS[@]}")" ]; then
            git --no-pager diff -- "${RUNS[@]}" | head -200
            git status --short -- "${RUNS[@]}"
            echo "a scripted run is stale or not deterministic: regenerate it and commit the result"
            exit 1
          fi
      # The docs build the client pages from examples/ snippets and runs, so a broken include or region fails here.
      # Docker examples (n8n, open-webui) are not run in CI: their scripted runs need `--docker` and a local daemon.
      - name: Docs build (client pages import from examples/)
        run: bun run docs:build
      # A contributor without uv can fix a stale run from this artifact, copied over examples/*/runs/scripted.
      - name: Upload the regenerated scripted runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-scripted-runs
          path: examples/*/runs/scripted
          if-no-files-found: ignore

  # The one check the ruleset requires for "all of CI" (see docs/releasing.md). It runs even when a job failed, and passes
  # only when every job in `needs` succeeded: a failed, cancelled or skipped job all count as not passed. A new gating job
  # goes in `needs` here. The advisory benchmark stays out. publish.yml calls this workflow, so a release is gated on it too.
  ci-passed:
    name: CI passed
    if: always()
    needs: [package, host-versions, host, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_passed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$not_passed" ]; then
            echo "::error::these CI jobs did not succeed:"
            echo "$not_passed"
            exit 1
          fi
          echo "All gating CI jobs succeeded."

  # #118, #315: request-path medians of the PR head against its base commit, both run in this job on the same
  # runner, so the comparison is like with like. Advisory: a shared runner is noisy, so a failure here never
  # blocks a merge. Only pull requests have a base to compare with.
  bench:
    name: Request-path benchmarks (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: base
      - name: Run the benchmarks on the base and the PR head, then compare
        run: |
          (cd base && bun test/bench/request.bench.ts --json "$RUNNER_TEMP/base.json")
          bun test/bench/request.bench.ts --json "$RUNNER_TEMP/head.json"
          bun .github/scripts/bench-gate.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" --summary
