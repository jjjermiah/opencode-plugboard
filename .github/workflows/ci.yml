name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by publish.yml so a release runs the same gates as CI.
  workflow_call:
  # host-bump.yml starts this on its own pull request: a PR opened with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Typecheck, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      # #110 and #100: per-layer test counts and coverage must stay at or above the floors in .github/floors/.
      - name: Test gates (test counts and coverage)
        run: |
          bun test --coverage --coverage-reporter=lcov --coverage-dir="$RUNNER_TEMP/gates" --reporter=junit --reporter-outfile="$RUNNER_TEMP/gates/junit.xml" > /dev/null
          bun .github/scripts/test-gates.ts "$RUNNER_TEMP/gates" --summary
      # #116: every route x request format x mode has a covering test, in the job summary; fails when the manifest and the router disagree.
      - name: Route coverage manifest
        run: bun .github/scripts/coverage-manifest.ts --summary
      # #101: the client x scenario x endpoint matrix, in the job summary; docs/compatibility.md must match it.
      - name: Client compatibility matrix
        env:
          PLUGBOARD_COMPAT_RESULTS: ${{ runner.temp }}/compat.json
        run: |
          bun test test/compat > /dev/null
          bun .github/scripts/compat-matrix.ts "$PLUGBOARD_COMPAT_RESULTS" --summary --docs docs/compatibility.md
          git diff --exit-code docs/compatibility.md || { echo "docs/compatibility.md is stale: regenerate it (see the file's header)"; exit 1; }
      # dist/tui.js (the compiled ./tui entry) is built here, not by prepack: `npm pack --ignore-scripts` skips prepack.
      - name: Build the compiled TUI entry
        run: bun run build:tui
      - name: Check the packed file list
        run: bun .github/scripts/check-pack.ts
      - name: Smoke-test the packed tarball
        run: bun .github/scripts/smoke-pack.ts
      # #167: docs.yml builds the site only on push to main, so a broken link or VitePress error shows here on the pull request.
      - name: Build the docs site
        run: bun run docs:build

  # The published @opencode/plugin versions inside the peer range, so a new host release is
  # picked up without editing this file.
  host-versions:
    name: Host versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: pick
        run: echo "versions=$(bun .github/scripts/host-versions.ts)" >> "$GITHUB_OUTPUT"

  host:
    name: OpenCode host ${{ matrix.host }}
    needs: host-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.host-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The host ships its own effect pin (2.0.26: rc.112, 2.0.27: 4.0.1); the typecheck must use that copy.
      - name: Install @opencode/plugin ${{ matrix.host }} and its effect
        env:
          HOST: ${{ matrix.host }}
        run: |
          EFFECT=$(npm view "@opencode/plugin@$HOST" dependencies.effect)
          bun add --dev --exact "@opencode/plugin@$HOST" "effect@$EFFECT"
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (when the package has a test script)
        run: |
          if [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = true ]; then
            bun run test
          else
            echo "No test script, skipping."
          fi

  compat:
    name: Compat kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Typecheck compat/js
        working-directory: compat/js
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
      - name: Compile compat Python
        run: git ls-files -z 'compat/py/*.py' 'compat/tools/*.py' | xargs -0 python3 -m py_compile
      - name: Syntax-check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  # #118: request-path medians against .github/floors/bench-baseline.json. Advisory: a shared runner is noisier
  # than the machine that wrote the baseline, so a failure here never blocks a merge.
  bench:
    name: Request-path benchmarks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run the benchmarks and gate them against the baseline
        run: |
          bun test/bench/request.bench.ts --json "$RUNNER_TEMP/bench.json"
          bun .github/scripts/bench-gate.ts "$RUNNER_TEMP/bench.json" --summary
