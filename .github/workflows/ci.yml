name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by publish.yml so a release runs the same gates as CI.
  workflow_call:
  # host-bump.yml starts this on its own pull request: a PR opened with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:

permissions: {}

# A newer run on the same branch cancels the older one, but never on main: the release script tags a merge commit
# only after that commit's own run on main passed (.github/scripts/release.ts), so a later push must not cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    name: Typecheck, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      # #110 and #100: per-layer test counts and coverage must stay at or above the floors in .github/floors/.
      - name: Test gates (test counts and coverage)
        run: |
          bun test --coverage --coverage-reporter=lcov --coverage-dir="$RUNNER_TEMP/gates" --reporter=junit --reporter-outfile="$RUNNER_TEMP/gates/junit.xml" > /dev/null
          bun .github/scripts/test-gates.ts "$RUNNER_TEMP/gates" --summary
      # #116: every route x request format x mode has a covering test, in the job summary; fails when the manifest and the router disagree.
      - name: Route coverage manifest
        run: bun .github/scripts/coverage-manifest.ts --summary
      # #101: the client x scenario x endpoint matrix, in the job summary; docs/compatibility.md must match it.
      - name: Client compatibility matrix
        env:
          PLUGBOARD_COMPAT_RESULTS: ${{ runner.temp }}/compat.json
        run: |
          bun test test/compat > /dev/null
          bun .github/scripts/compat-matrix.ts "$PLUGBOARD_COMPAT_RESULTS" --summary --docs docs/compatibility.md
          git diff --exit-code docs/compatibility.md || { echo "docs/compatibility.md is stale: regenerate it (see the file's header)"; exit 1; }
      # dist/tui.js (the compiled ./tui entry) is built here, not by prepack: `npm pack --ignore-scripts` skips prepack.
      - name: Build the compiled TUI entry
        run: bun run build:tui
      - name: Check the packed file list
        run: bun .github/scripts/check-pack.ts
      - name: Smoke-test the packed tarball
        run: bun .github/scripts/smoke-pack.ts
      # #167: docs.yml builds the site only on push to main, so a broken link or VitePress error shows here on the pull request.
      - name: Build the docs site
        run: bun run docs:build

  # The published @opencode/plugin versions inside the peer range, so a new host release is
  # picked up without editing this file.
  host-versions:
    name: Host versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: pick
        run: echo "versions=$(bun .github/scripts/host-versions.ts)" >> "$GITHUB_OUTPUT"

  host:
    name: OpenCode host ${{ matrix.host }}
    needs: host-versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.host-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The host ships its own effect pin (2.0.26: rc.112, 2.0.27: 4.0.1); the typecheck must use that copy.
      - name: Install @opencode/plugin ${{ matrix.host }} and its effect
        env:
          HOST: ${{ matrix.host }}
        run: |
          EFFECT=$(npm view "@opencode/plugin@$HOST" dependencies.effect)
          bun add --dev --exact "@opencode/plugin@$HOST" "effect@$EFFECT"
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (when the package has a test script)
        run: |
          if [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = true ]; then
            bun run test
          else
            echo "No test script, skipping."
          fi

  compat:
    name: Compat kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Typecheck compat/js
        working-directory: compat/js
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
      - name: Compile compat Python
        run: git ls-files -z 'compat/py/*.py' 'compat/tools/*.py' | xargs -0 python3 -m py_compile
      - name: Syntax-check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  # The scripted runs of the client examples take about 5 seconds and are deterministic. A diff, or a new file in the run
  # directories, means a run went stale: regenerate it with `bun examples/_harness/run.ts <example> --target scripted`.
  examples:
    name: Examples (scripted runs are current)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install uv (the Python example runs with uv run --frozen)
        run: pipx install uv==0.12.18
      - name: Scripted runs of the curl, openai-python, vercel-ai-sdk, langchain-python and langchain-js examples
        run: |
          bun examples/_harness/run.ts curl --target scripted
          bun examples/_harness/run.ts openai-python --target scripted
          bun examples/_harness/run.ts vercel-ai-sdk --target scripted
          bun examples/_harness/run.ts langchain-python --target scripted
          bun examples/_harness/run.ts langchain-js --target scripted
      - name: The committed scripted runs match a fresh run
        run: |
          RUNS=(examples/curl/runs/scripted examples/openai-python/runs/scripted examples/vercel-ai-sdk/runs/scripted examples/langchain-python/runs/scripted examples/langchain-js/runs/scripted)
          if [ -n "$(git status --porcelain -- "${RUNS[@]}")" ]; then
            git --no-pager diff -- "${RUNS[@]}" | head -200
            git status --short -- "${RUNS[@]}"
            echo "a scripted run is stale or not deterministic: regenerate it and commit the result"
            exit 1
          fi

  # The one check the ruleset requires for "all of CI" (see docs/releasing.md). It runs even when a job failed, and passes
  # only when every job in `needs` succeeded: a failed, cancelled or skipped job all count as not passed. A new gating job
  # goes in `needs` here. The advisory benchmark stays out. publish.yml calls this workflow, so a release is gated on it too.
  ci-passed:
    name: CI passed
    if: always()
    needs: [package, host-versions, host, compat, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_passed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$not_passed" ]; then
            echo "::error::these CI jobs did not succeed:"
            echo "$not_passed"
            exit 1
          fi
          echo "All gating CI jobs succeeded."

  # #118, #315: request-path medians of the PR head against its base commit, both run in this job on the same
  # runner, so the comparison is like with like. Advisory: a shared runner is noisy, so a failure here never
  # blocks a merge. Only pull requests have a base to compare with.
  bench:
    name: Request-path benchmarks (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: base
      - name: Run the benchmarks on the base and the PR head, then compare
        run: |
          (cd base && bun test/bench/request.bench.ts --json "$RUNNER_TEMP/base.json")
          bun test/bench/request.bench.ts --json "$RUNNER_TEMP/head.json"
          bun .github/scripts/bench-gate.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" --summary
