name: Scorecard

# OpenSSF Scorecard: an automated check of supply-chain practices. With publish_results the score
# is published for the badge in README.md, and the SARIF is uploaded to code scanning.
#
# scorecard-action v2 restricts the producing workflow (see its README, "Workflow Restrictions"),
# and the results are rejected if the rules break. So: no top-level env or defaults, no
# write permissions at the top, id-token: write only on the one job, and only the actions listed
# in that README on that job. Do not add steps to the analysis job without checking those rules.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "20 7 * * 2"

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results (the badge and the REST API)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF for five days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
