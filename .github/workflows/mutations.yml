name: Mutations

# Weekly (#111): every guard in test/mutations/catalogue.ts must still break a test when it is
# broken. A run applies each mutation to a copy of the source (a few minutes), so it is not on
# every push. A failure is a real gap in the tests, not flakiness. Not a required check.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutations:
    name: Mutation catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply each mutation and require a failing test
        run: bun .github/scripts/mutation-check.ts --summary
