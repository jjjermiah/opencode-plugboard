name: OpenCode release watch

# Daily: installs the newest OpenCode CLI in CI, starts an isolated server with plugboard loaded
# from this checkout as a local plugin, and checks that the plugin loads and its listener answers.
# No provider credentials, so no model call. A failure opens or updates the issue "OpenCode <v>
# breaks plugboard" (label bug). The same-day path for a new host is host-bump.yml. See
# docs/releasing.md#opencode-releases.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: opencode-release-watch
  cancel-in-progress: false

jobs:
  load:
    name: Load plugboard in the newest OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.cli.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # A local-path plugin gets no install, so the checkout needs its dependencies and the TUI build.
      - run: bun install --frozen-lockfile
      - run: bun run build:tui
      - name: Install the newest OpenCode CLI
        id: cli
        run: |
          version=$(npm view @opencode/cli-linux-x64 version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm gave no stable CLI version (got: $version)"
            exit 1
          fi
          # The newest version is the point of this watch, so it cannot be pinned by hash. `npm pack` plus tar fetches the
          # package without an install (the package is one binary, with no dependencies and no install scripts).
          mkdir -p "$RUNNER_TEMP/opencode-cli"
          tgz=$(npm pack "@opencode/cli-linux-x64@$version" --pack-destination "$RUNNER_TEMP/opencode-cli" --json \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          tar -xzf "$RUNNER_TEMP/opencode-cli/$tgz" -C "$RUNNER_TEMP/opencode-cli"
          bin="$RUNNER_TEMP/opencode-cli/package/bin/opencode"
          "$bin" --version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Load plugboard in the isolated server
        env:
          BIN: ${{ steps.cli.outputs.bin }}
        run: bun .github/scripts/opencode-load-check.ts --bin "$BIN" --checkout "$GITHUB_WORKSPACE"

  report:
    name: Open or update the breakage issue
    needs: load
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open or comment on the issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.load.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/breakage-issue.sh "${VERSION:-unknown}" "$RUN_URL"
