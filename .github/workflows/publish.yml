name: Publish

# Pushing a v* tag (bun run release x.y.z --push) runs the CI gates, publishes to
# npm with trusted publishing (OIDC, no token) and creates the GitHub release from
# the CHANGELOG.md section. "Run workflow" with dry_run (the default) exercises
# everything except the two writes. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but npm publish --dry-run and no GitHub release. Untick only on a tag ref, to re-run a release."
        type: boolean
        default: true

permissions: {}

# One publish per ref. Never cancel a publish that is already running.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same jobs CI runs (typecheck, pack check, compat checks), not a copy.
  ci:
    name: CI gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: ${{ inputs.dry_run == true && 'Publish (dry run)' || 'Publish' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing (npm exchanges this OIDC token)
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches, so the tag-on-main check can see origin/main
          persist-credentials: false

      - name: Check the ref
        id: ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME is not on main"
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::a real publish must run from a v* tag, not from branch $REF_NAME"
            exit 1
          else
            echo "Dry run from branch $REF_NAME: skipping the tag checks."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Before anything irreversible: a missing or empty CHANGELOG section fails here.
      - name: Build the release notes
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          bun scripts/release-notes.ts "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # never cache in a release build
      - name: Use npm 11.5.1 or newer (trusted publishing needs it)
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      # Trusted publishing works from a private repository, but npm cannot make a
      # provenance attestation for one, so --provenance is only added when public.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.ref.outputs.version }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          name=$(node -p 'require("./package.json").name')
          args=(--access public)
          case "$VERSION" in *-*) args+=(--tag next) ;; esac
          if [ "$REPO_PRIVATE" != true ]; then args+=(--provenance); fi
          if [ "$DRY_RUN" = true ]; then
            npm publish "${args[@]}" --dry-run
          elif [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
            echo "$name@$VERSION is already on npm, skipping the publish."
          else
            npm publish "${args[@]}"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would run gh release create $TAG ${flags[*]}"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
