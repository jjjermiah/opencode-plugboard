name: Publish

# Runs when a v* tag is pushed (bun run release x.y.z --push). Publishes to npm
# with trusted publishing (OIDC, no token) and provenance, then creates the
# GitHub release from the CHANGELOG.md section. See docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Require a public repository
        if: github.event.repository.private
        run: |
          echo "::error::npm provenance needs a public repository. Until this repo is public, publish by hand with 'npm publish --auth-type=web' from the tag, then run 'gh release create'. See docs/releasing.md."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG is not on main"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun scripts/check-pack.ts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Use npm 11.5.1 or newer (trusted publishing needs it)
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it alone."
            exit 0
          fi
          bun scripts/release-notes.ts "$TAG" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
