name: Publish

# Pushing a v* tag runs the CI gates, publishes to npm with trusted publishing (OIDC, no token),
# attests the tarball, and creates the GitHub release (named "vX.Y.Z: Title") from the CHANGELOG.md
# section, with the tarball, its CycloneDX SBOM and the attestation bundle attached. The tag is
# made by `bun run release x.y.z --push` once the release pull request is merged. "Run workflow"
# with dry_run (the default) exercises everything except the writes: npm publish, the attestation
# and the GitHub release. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but npm publish --dry-run, the attestation and the GitHub release. Untick only on a tag ref, to re-run a release."
        type: boolean
        default: true

permissions: {}

# One publish per ref. Never cancel a publish that is already running.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same jobs CI runs (typecheck, tests, pack check, compat checks), not a copy.
  ci:
    name: CI gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Packs the tarball once, publishes that exact file to npm, and writes its SBOM. The
  # permissions are what npm needs (id-token) and nothing else; the release is a separate job.
  publish:
    name: ${{ inputs.dry_run == true && 'Publish (dry run)' || 'Publish' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (npm exchanges this OIDC token)
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    outputs:
      name: ${{ steps.ref.outputs.name }}
      version: ${{ steps.ref.outputs.version }}
      tag: ${{ steps.ref.outputs.tag }}
      title: ${{ steps.notes.outputs.title }}
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches, so the tag-on-main check can see origin/main
          persist-credentials: false

      - name: Check the ref
        id: ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $REF_NAME is not on main"
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::a real publish must run from a v* tag, not from branch $REF_NAME"
            exit 1
          else
            echo "Dry run from branch $REF_NAME: skipping the tag checks."
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The TUI entry ships precompiled (dist/tui.js, see docs/packaging.md). npm publish runs
      # prepack, which needs the Babel devDependencies, so install them and build up front;
      # a missing build fails here, before anything irreversible.
      - name: Build the TUI entry
        run: |
          bun install --frozen-lockfile
          bun run build:tui
          test -s dist/tui.js

      # Before anything irreversible: a missing or empty CHANGELOG section, or a
      # heading without a title (`## [x.y.z] - date: Title`), fails here.
      - name: Build the release notes
        id: notes
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          title=$(bun .github/scripts/release-notes.ts "$TAG" --title)
          bun .github/scripts/release-notes.ts "$TAG" > "$RUNNER_TEMP/release/notes.md"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "Release title: $TAG: $title"
          cat "$RUNNER_TEMP/release/notes.md"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # never cache in a release build
      - name: Use npm 11.21.0 (trusted publishing needs 11.5.1 or newer; pinned, not a range)
        run: |
          npm install -g npm@11.21.0
          npm --version

      # The tarball is packed once, here, and that exact file is what is published, attested and
      # attached to the release. --ignore-scripts because build:tui already ran above.
      - name: Pack the tarball once and write the SBOM
        id: pack
        env:
          NAME: ${{ steps.ref.outputs.name }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          tgz=$(npm pack --ignore-scripts --pack-destination "$dir" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          test -s "$dir/$tgz"
          npm sbom --sbom-format cyclonedx --omit dev > "$dir/$NAME-$VERSION.cdx.json"
          test -s "$dir/$NAME-$VERSION.cdx.json"
          sha=$(sha256sum "$dir/$tgz" | cut -d' ' -f1)
          {
            echo "tarball=$dir/$tgz"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "$sha  $tgz"
          ls -l "$dir"

      # Trusted publishing works from a private repository, but npm cannot make a
      # provenance attestation for one, so --provenance is only added when public.
      # The packed file is published as it is, so the registry holds the attested bytes.
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.ref.outputs.version }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          name=$(node -p 'require("./package.json").name')
          args=(--access public)
          case "$VERSION" in *-*) args+=(--tag next) ;; esac
          if [ "$REPO_PRIVATE" != true ]; then args+=(--provenance); fi
          if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
            echo "$name@$VERSION is already on npm, not publishing it again."
          elif [ "$DRY_RUN" = true ]; then
            npm publish "$TARBALL" "${args[@]}" --dry-run
          else
            npm publish "$TARBALL" "${args[@]}"
          fi

      - name: Keep the release files for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  # Attests the tarball with GitHub's build provenance (a Sigstore bundle). The permissions are for
  # this job only: attestations to store the attestation, id-token to sign it.
  attest:
    name: ${{ inputs.dry_run == true && 'Attest (dry run)' || 'Attest' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # store the attestation
      id-token: write # sign it with this workflow's OIDC identity
      contents: read
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Get the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release

      # The file the attest job holds must be the file the publish job packed and published.
      - name: Check the file is the one the publish job published
        env:
          EXPECTED: ${{ needs.publish.outputs.tarball_sha256 }}
        run: |
          tgz=$(ls "$RUNNER_TEMP"/release/*.tgz)
          actual=$(sha256sum "$tgz" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::the tarball sha256 is $actual, the publish job packed $EXPECTED. Not attesting it."
            exit 1
          fi
          echo "sha256 $actual matches the publish job."

      # Refuse to attest a file that npm does not serve: the attestation would then vouch for a
      # tarball nobody installs. npm can take a moment to serve a version it has just published.
      - name: Check the tarball is the one npm serves
        if: env.DRY_RUN != 'true'
        env:
          NAME: ${{ needs.publish.outputs.name }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          tgz=$(ls "$RUNNER_TEMP"/release/*.tgz)
          digest="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          served=""
          for _ in $(seq 1 12); do
            served=$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)
            if [ "$served" = "$digest" ]; then
              echo "The packed tarball matches the integrity npm serves for $NAME@$VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "::error::the packed tarball ($digest) is not what npm serves for $NAME@$VERSION ($served). Not attesting it."
          exit 1

      - name: Attest the tarball
        if: env.DRY_RUN != 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz

      # The bundle is named after the tarball, so the release asset is recognisable as the
      # tarball's Sigstore bundle (the *.sigstore.json pattern that OpenSSF Scorecard looks for).
      - name: Name the bundle after the tarball
        if: env.DRY_RUN != 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          tgz=$(ls "$RUNNER_TEMP"/release/*.tgz)
          mkdir -p "$RUNNER_TEMP/attestation"
          cp "$BUNDLE" "$RUNNER_TEMP/attestation/$(basename "$tgz").sigstore.json"
          ls -l "$RUNNER_TEMP/attestation"

      - name: Keep the attestation for the release job
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestation
          path: ${{ runner.temp }}/attestation
          if-no-files-found: error
          retention-days: 1

  # Creates the GitHub release with the notes, the tarball, the SBOM and the attestation attached.
  # It holds contents: write and nothing else.
  release:
    name: ${{ inputs.dry_run == true && 'Create the release (dry run)' || 'Create the GitHub release' }}
    needs: [publish, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Get the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          TITLE: ${{ needs.publish.outputs.title }}
        run: |
          dir="$RUNNER_TEMP/release"
          shopt -s nullglob
          assets=("$dir"/*.tgz "$dir"/*.cdx.json "$dir"/*.sigstore.json)
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would run gh release create $TAG --title \"$TAG: $TITLE\" ${flags[*]} with the files: ${assets[*]}"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, attaching the files to it."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG: $TITLE" --notes-file "$dir/notes.md" "${flags[@]}" "${assets[@]}"
          fi
