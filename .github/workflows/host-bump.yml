name: Host bump

# Daily: when a newer @opencode/plugin inside the peer range is published, open or update one pull
# request `build(deps): support opencode <v>` (branch deps/opencode-<v>). It bumps the pinned
# devDependencies, widens the peers (.github/scripts/host-bump.ts), and runs the typecheck, tests,
# TUI build, check-pack and smoke-pack. Green: labelled `dependencies` and set to auto-merge, so it
# lands when the required checks pass. Red: a draft with the failing log tail, and the issue
# "OpenCode <v> breaks plugboard" links the run. See docs/releasing.md#opencode-releases.
#
# Two jobs, so the code that installs the newest host never holds write access (#157). `check`
# installs the host and runs the gates with read-only permissions, then uploads the two files the
# bump changes and the gate logs. `open-pr` holds the write permissions, takes only those files on a
# clean checkout of the default branch, refuses any other change, and opens the PR.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: host-bump
  cancel-in-progress: false

jobs:
  check:
    name: Install the newest host and test it
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # pipefail matters: the gates pipe into tee, and a failing gate must still fail its step.
    defaults:
      run:
        shell: bash
    outputs:
      bump: ${{ steps.version.outputs.bump }}
      latest: ${{ steps.version.outputs.latest }}
      pinned: ${{ steps.version.outputs.pinned }}
      typecheck: ${{ steps.results.outputs.typecheck }}
      tests: ${{ steps.results.outputs.tests }}
      build: ${{ steps.results.outputs.build }}
      pack: ${{ steps.results.outputs.pack }}
      smoke: ${{ steps.results.outputs.smoke }}
      failed: ${{ steps.results.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Find the newest host in the peer range
        id: version
        run: |
          latest=$(bun .github/scripts/host-versions.ts --latest)
          pinned=$(node -p 'require("./package.json").devDependencies["@opencode/plugin"]')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$pinned" ]; then
            echo "Pinned @opencode/plugin $pinned is already the newest in range."
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      # Not continue-on-error: a bump that cannot be made fails the run (GitHub mails the workflow
      # owner) and the report job files the issue. The gates below are the ones a draft records.
      - name: Bump the pinned devDependencies and the peers
        if: steps.version.outputs.bump == 'true'
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          mkdir -p "$RUNNER_TEMP/host-bump-logs"
          bun install --frozen-lockfile
          bun .github/scripts/host-bump.ts "$LATEST" 2>&1 | tee "$RUNNER_TEMP/host-bump-logs/bump.log"
          git diff --stat

      - name: Typecheck
        id: typecheck
        if: steps.version.outputs.bump == 'true'
        continue-on-error: true
        run: bun run typecheck 2>&1 | tee "$RUNNER_TEMP/host-bump-logs/typecheck.log"

      - name: Tests (when the package has a test script)
        id: tests
        if: steps.version.outputs.bump == 'true'
        continue-on-error: true
        run: |
          if [ "$(node -p 'Boolean(require("./package.json").scripts?.test)')" = true ]; then
            bun run test 2>&1 | tee "$RUNNER_TEMP/host-bump-logs/tests.log"
          else
            echo "No test script, skipping." | tee "$RUNNER_TEMP/host-bump-logs/tests.log"
          fi

      - name: Build the compiled TUI entry
        id: build
        if: steps.version.outputs.bump == 'true'
        continue-on-error: true
        run: bun run build:tui 2>&1 | tee "$RUNNER_TEMP/host-bump-logs/build.log"

      - name: Check the packed file list
        id: pack
        if: steps.version.outputs.bump == 'true'
        continue-on-error: true
        run: bun .github/scripts/check-pack.ts 2>&1 | tee "$RUNNER_TEMP/host-bump-logs/check-pack.log"

      - name: Smoke-test the packed tarball (a fresh install of the peers)
        id: smoke
        if: steps.version.outputs.bump == 'true'
        continue-on-error: true
        run: bun .github/scripts/smoke-pack.ts 2>&1 | tee "$RUNNER_TEMP/host-bump-logs/smoke-pack.log"

      - name: Record the results for the PR job
        id: results
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PACK: ${{ steps.pack.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          failed=false
          for outcome in "$TYPECHECK" "$TESTS" "$BUILD" "$PACK" "$SMOKE"; do
            if [ "$outcome" = failure ]; then failed=true; fi
          done
          {
            echo "typecheck=$TYPECHECK"
            echo "tests=$TESTS"
            echo "build=$BUILD"
            echo "pack=$PACK"
            echo "smoke=$SMOKE"
            echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"

      - name: Hand the bump to the PR job
        if: steps.version.outputs.bump == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-bump
          path: |
            package.json
            bun.lock
          if-no-files-found: error
          retention-days: 1

      - name: Hand the gate logs to the PR job
        if: steps.version.outputs.bump == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-bump-logs
          path: ${{ runner.temp }}/host-bump-logs
          if-no-files-found: warn
          retention-days: 1

  open-pr:
    name: Open the bump pull request
    needs: check
    if: needs.check.outputs.bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the PR, set auto-merge
      issues: write # the breakage issue when a gate fails
      actions: write # approve the bot's pull_request runs, and start ci.yml, commits.yml and codeql.yml on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch the files the check job validated
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-bump
          path: ${{ runner.temp }}/host-bump

      - name: Fetch the gate logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-bump-logs
          path: ${{ runner.temp }}/host-bump-logs

      - name: Take only package.json and bun.lock, and refuse any other change
        run: |
          cp "$RUNNER_TEMP/host-bump/package.json" "$RUNNER_TEMP/host-bump/bun.lock" .
          other=$(git status --porcelain=v1 --untracked-files=all | grep -v -E '^ M (package\.json|bun\.lock)$' || true)
          if [ -n "$other" ]; then
            echo "The bump changes files other than package.json and bun.lock; not opening a PR:"
            echo "$other"
            exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "The bump changes nothing against the default branch; not opening a PR."
            exit 1
          fi
          git status --short

      - name: Write the pull request body
        env:
          LATEST: ${{ needs.check.outputs.latest }}
          PINNED: ${{ needs.check.outputs.pinned }}
          TYPECHECK: ${{ needs.check.outputs.typecheck }}
          TESTS: ${{ needs.check.outputs.tests }}
          BUILD: ${{ needs.check.outputs.build }}
          PACK: ${{ needs.check.outputs.pack }}
          SMOKE: ${{ needs.check.outputs.smoke }}
          FAILED: ${{ needs.check.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "OpenCode published \`@opencode/plugin\` $LATEST. This bumps the pinned dev dependency from $PINNED to it, and \`effect\` to the version that host pins. The peers are widened only where the new version needs it (see the bump log below)."
            echo
            echo "- Typecheck: $TYPECHECK"
            echo "- Tests: $TESTS"
            echo "- TUI build: $BUILD"
            echo "- Check pack: $PACK"
            echo "- Smoke pack: $SMOKE"
            echo
            if [ "$FAILED" = true ]; then
              echo "**A gate failed**, so this is a draft. The issue \`OpenCode $LATEST breaks plugboard\` links the run."
            else
              echo "All gates passed. Auto-merge is on: it lands when the required checks pass."
            fi
            echo
            echo "The OpenCode load check (\`opencode-release.yml\`) is not run here: it needs the newest CLI, and no provider credentials are used in CI, so the pong gate (a real prompt, \`docs/development.md\`) is still manual for a host change."
            echo
            echo "Run: $RUN_URL"
            for log in "$RUNNER_TEMP"/host-bump-logs/*.log; do
              [ -f "$log" ] || continue
              echo
              echo "<details><summary>$(basename "$log") (last 40 lines)</summary>"
              echo
              echo '```text'
              tail -n 40 "$log"
              echo '```'
              echo
              echo "</details>"
            done
            echo
            echo "Opened by \`.github/workflows/host-bump.yml\`."
          } > "$body"

      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/opencode-${{ needs.check.outputs.latest }}
          delete-branch: true
          add-paths: |
            package.json
            bun.lock
          commit-message: |
            build(deps): support opencode ${{ needs.check.outputs.latest }}

            OpenCode published @opencode/plugin ${{ needs.check.outputs.latest }}. The bump pins it,
            pins the effect version it uses, and widens the peer ranges only where needed.
            Opened and checked by .github/workflows/host-bump.yml.
          title: "build(deps): support opencode ${{ needs.check.outputs.latest }}"
          labels: dependencies
          draft: ${{ needs.check.outputs.failed == 'true' }}
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Approve the pull request's runs (GitHub holds them until someone approves)
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # A pull request opened with GITHUB_TOKEN gets its pull_request runs in action_required, and
          # the repo's approval policy (first_time_contributors) treats the bot as a first-time
          # contributor. Until a person or token approves them, their required checks stay pending.
          # Approve them here, on the head commit. A failure warns, so the next steps still run.
          sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          ids=""
          for _ in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$sha&status=action_required" --jq '.workflow_runs[].id') \
              || { echo "::warning::could not list the runs on $sha"; exit 0; }
            if [ -n "$ids" ]; then break; fi
            sleep 10
          done
          if [ -z "$ids" ]; then
            echo "::notice::No approval-required pull_request run on $sha after a minute."
          fi
          for id in $ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null \
              || echo "::warning::could not approve run $id on $sha. Approve it by hand: Approve workflows to run, in the pull request's merge box."
          done

      - name: Start the checks, then auto-merge, or open the breakage issue
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          BRANCH: deps/opencode-${{ needs.check.outputs.latest }}
          LATEST: ${{ needs.check.outputs.latest }}
          FAILED: ${{ needs.check.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Also start every workflow that reports a required check on the branch, so each required
          # check has a run that does not wait for approval. A failure here warns, and the pull request
          # then lacks that check: start it by hand.
          for wf in ci.yml commits.yml codeql.yml; do
            gh workflow run "$wf" --ref "$BRANCH" \
              || echo "::warning::could not start $wf on $BRANCH; the pull request has no $wf check. Start it by hand: gh workflow run $wf --ref $BRANCH"
          done
          if [ "$FAILED" = true ]; then
            bash .github/scripts/breakage-issue.sh "$LATEST" "$RUN_URL"
            exit 0
          fi
          if [ -n "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            echo "Auto-merge is already on for #$PR."
          else
            gh pr merge "$PR" --auto --merge
          fi

  report:
    name: Report a bump that could not run
    needs: check
    if: failure() && needs.check.outputs.latest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open or comment on the issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/breakage-issue.sh "$LATEST" "$RUN_URL"
