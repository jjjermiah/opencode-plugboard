name: CodeQL

# Static analysis of the TypeScript and JavaScript source with GitHub's CodeQL. Results appear
# under the Security tab (code scanning). The file is versioned here, so do not also enable
# "default setup" for the repository, which would analyse the same code twice.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  # host-bump.yml approves it on its branch: a pull request opened with GITHUB_TOKEN holds its pull_request runs for approval, and the required Analyze check would never report until then.
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JavaScript and TypeScript need no build step, so the analysis reads the sources directly.
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"
