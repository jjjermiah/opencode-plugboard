[test]
# Only the suite under test/; the top-level examples/ and compat/ are not tests (test/compat/ is
# the automated client matrix, part of the suite).
root = "test"
# Points HOME and the XDG dirs at a throwaway directory before any test module loads.
preload = ["./test/setup.ts"]
# Coverage measures the package (index.ts and src/), not the suite's own helpers.
coveragePathIgnorePatterns = ["test/**"]
